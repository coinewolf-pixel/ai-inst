events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }
    upstream ai_orchestrator {
        server ai-orchestrator:8000;
    }
    upstream exchange_connector {
        server exchange-connector:8000;
    }
    upstream risk_engine {
        server risk-engine:8000;
    }
    upstream auth_service {
        server auth-service:8000;
    }
    upstream market_data {
        server market-data:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # API Gateway
        location /api/v1/ai/ {
            proxy_pass http://ai_orchestrator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/exchange/ {
            proxy_pass http://exchange_connector/;
            proxy_set_header Host $host;
        }

        location /api/v1/risk/ {
            proxy_pass http://risk_engine/;
            proxy_set_header Host $host;
        }

        location /api/v1/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
        }

        location /api/v1/market/ {
            proxy_pass http://market_data/;
            proxy_set_header Host $host;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://market_data/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
