version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: nexorum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexorum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexorum_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-nexorum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexorum"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexorum-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: nexorum-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: nexorum
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-nexorum}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ch_secret}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./database/clickhouse:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"
      - "9000:9000"

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: nexorum-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: nexorum-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ── Backend Microservices ─────────────────────────
  ai-orchestrator:
    build:
      context: ./backend/ai-orchestrator
      dockerfile: Dockerfile
    container_name: nexorum-ai-orchestrator
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-nexorum}:${POSTGRES_PASSWORD:-nexorum_secret_2026}@postgres:5432/${POSTGRES_DB:-nexorum}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8001:8000"

  exchange-connector:
    build:
      context: ./backend/exchange-connector
      dockerfile: Dockerfile
    container_name: nexorum-exchange-connector
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-nexorum}:${POSTGRES_PASSWORD:-nexorum_secret_2026}@postgres:5432/${POSTGRES_DB:-nexorum}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8002:8000"

  risk-engine:
    build:
      context: ./backend/risk-engine
      dockerfile: Dockerfile
    container_name: nexorum-risk-engine
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-nexorum}:${POSTGRES_PASSWORD:-nexorum_secret_2026}@postgres:5432/${POSTGRES_DB:-nexorum}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CLICKHOUSE_URL=http://${CLICKHOUSE_USER:-nexorum}:${CLICKHOUSE_PASSWORD:-ch_secret}@clickhouse:8123/nexorum
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8003:8000"

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: nexorum-auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-nexorum}:${POSTGRES_PASSWORD:-nexorum_secret_2026}@postgres:5432/${POSTGRES_DB:-nexorum}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8004:8000"

  market-data:
    build:
      context: ./backend/market-data
      dockerfile: Dockerfile
    container_name: nexorum-market-data
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CLICKHOUSE_URL=http://${CLICKHOUSE_USER:-nexorum}:${CLICKHOUSE_PASSWORD:-ch_secret}@clickhouse:8123/nexorum
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started
      clickhouse:
        condition: service_started
    ports:
      - "8005:8000"

  # ── Frontend ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexorum-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
    ports:
      - "3000:3000"

  # ── Gateway ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexorum-gateway
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - ai-orchestrator
      - exchange-connector
      - risk-engine
      - auth-service
      - market-data
      - frontend

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
