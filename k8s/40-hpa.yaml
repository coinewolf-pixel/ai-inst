apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexorum-ai-orchestrator-hpa
  namespace: nexorum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexorum-ai-orchestrator
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexorum-exchange-connector-hpa
  namespace: nexorum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexorum-exchange-connector
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
