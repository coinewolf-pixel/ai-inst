apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexorum-kafka
  namespace: nexorum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexorum-kafka
  template:
    metadata:
      labels:
        app: nexorum-kafka
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:latest
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
      - name: kafka
        image: confluentinc/cp-kafka:latest
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "localhost:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://nexorum-kafka:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: nexorum-kafka
  namespace: nexorum
spec:
  selector:
    app: nexorum-kafka
  ports:
  - port: 9092
    targetPort: 9092
