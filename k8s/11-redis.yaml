apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexorum-redis
  namespace: nexorum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexorum-redis
  template:
    metadata:
      labels:
        app: nexorum-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nexorum-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: nexorum-redis
  namespace: nexorum
spec:
  selector:
    app: nexorum-redis
  ports:
  - port: 6379
    targetPort: 6379
