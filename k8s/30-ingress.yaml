apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexorum-ingress
  namespace: nexorum
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.nexorum.ai
    - app.nexorum.ai
    secretName: nexorum-tls
  rules:
  - host: api.nexorum.ai
    http:
      paths:
      - path: /api/v1/ai
        pathType: Prefix
        backend:
          service:
            name: nexorum-ai-orchestrator
            port:
              number: 8000
      - path: /api/v1/exchange
        pathType: Prefix
        backend:
          service:
            name: nexorum-exchange-connector
            port:
              number: 8000
      - path: /api/v1/risk
        pathType: Prefix
        backend:
          service:
            name: nexorum-risk-engine
            port:
              number: 8000
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: nexorum-auth-service
            port:
              number: 8000
      - path: /api/v1/market
        pathType: Prefix
        backend:
          service:
            name: nexorum-market-data
            port:
              number: 8000
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: nexorum-market-data
            port:
              number: 8000
  - host: app.nexorum.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nexorum-frontend
            port:
              number: 3000
